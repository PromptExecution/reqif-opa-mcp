[project]
name = "reqif-mcp"
version = "0.1.0"
description = "ReqIF-OPA-SARIF compliance gate system for validating ReqIF requirements with OPA policies and producing SARIF reports."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.26.0",
    "python-ulid>=3.1.0",
    "returns>=0.26.0",
    "fastmcp==3.0.0b1",
    "reqif>=0.0.48",
]

[project.optional-dependencies]
ingest-lite = [
    "openpyxl>=3.1.5",
    "pypdf>=6.8.0",
]
ingest-full = [
    "docling>=2.79.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.8.0",
]
llm-review = [
    "azure-ai-inference>=1.0.0b9",
]
nats-service = [
    "nats-py>=2.15.0",
]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "types-jsonschema>=4.26.0.20260109",
]

# `reqif` (used by reqif_mcp.reqif_parser) ships no py.typed marker or stub
# package, so mypy can only see it as untyped -- same reason
# types-jsonschema exists above for jsonschema. lxml (a reqif transitive
# dependency, imported directly for its exception types) does have a real
# stub package; ignore_missing_imports here is only a fallback for
# environments (e.g. an `ingest-lite`-only sync) that don't install it.
[[tool.mypy.overrides]]
module = ["reqif.*", "lxml.*"]
ignore_missing_imports = true
